task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 79 # 번호판 OCR: 숫자 0-9 + 한글 음절 + 지역명 + 특수 (category id 1~78, max id 78 + 1)
                # id 0 'objects'는 Roboflow가 넣은 더미 supercategory로 어노테이션이 0개다.
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../dataset/train
    ann_file: ../dataset/train/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../dataset/valid
    ann_file: ../dataset/valid/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
